name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer le dossier www
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            HTML=$(ls ./*.html 2>/dev/null | head -n 1)
            if [ -z "$HTML" ]; then
              echo "ERREUR : aucun fichier .html dans le depot. Envoyez votre fichier .html."
              exit 1
            fi
            echo "Fichier HTML utilise : $HTML"
            cp "$HTML" www/index.html
          fi
          ls -la www
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PainBle-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
